name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck (allowJs + checkJs)
        run: npm run typecheck
      - name: Syntax gate (node --check + client CJS shape)
        run: node scripts/check-syntax.mjs
      - name: Pack
        run: npm pack
